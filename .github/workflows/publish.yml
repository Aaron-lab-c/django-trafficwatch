name: Publish to PyPI

on:
  push:
    tags: ["v*"]          # git tag v0.1.0 && git push --tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Check tag matches package version
        run: |
          PKG=$(python -c "import sys; sys.path.insert(0,'src'); import django_trafficwatch as m; print(m.__version__)")
          TAG="${GITHUB_REF_NAME#v}"
          [ "$PKG" = "$TAG" ] || { echo "tag $TAG != __version__ $PKG"; exit 1; }
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi            # create this environment in repo settings
    permissions:
      id-token: write            # required for PyPI Trusted Publishing (no API token needed)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
