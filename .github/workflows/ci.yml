name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check src tests acceptance

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,typing]"
      - run: mypy --strict src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        django-version: ["4.2", "5.2", "6.0", "6.1"]
        exclude:
          # Django 5.2 needs Python >= 3.10, Django 6.x needs Python >= 3.12
          - python-version: "3.9"
            django-version: "5.2"
          - python-version: "3.9"
            django-version: "6.0"
          - python-version: "3.9"
            django-version: "6.1"
          - python-version: "3.10"
            django-version: "6.0"
          - python-version: "3.10"
            django-version: "6.1"
          - python-version: "3.11"
            django-version: "6.0"
          - python-version: "3.11"
            django-version: "6.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install "Django~=${{ matrix.django-version }}.0" -e ".[dev]"
      - run: pytest -q

  # The whole suite against Memcached (PyMemcacheCache): incr on memcached, Lua fallback.
  test-memcached:
    runs-on: ubuntu-latest
    services:
      memcached:
        image: memcached:1.6-alpine
        ports: ["11211:11211"]
    env:
      TW_MEMCACHED: localhost:11211
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" pymemcache
      - run: pytest -q

  # The whole suite again, this time with django.core.cache.backends.redis.RedisCache as the
  # counter store, plus the Redis-only tests (Lua backend, threaded incr atomicity).
  test-redis:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        django-version: ["4.2", "6.1"]
    env:
      TW_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "Django~=${{ matrix.django-version }}.0" -e ".[dev]"
      - run: pytest -q

  # The user's view: build the wheel, install it in a clean environment, copy only the
  # acceptance project out of the repo (so src/ is not importable) and drive the package
  # through HTTP exactly as the README describes. Catches packaging mistakes as well as
  # behaviour regressions.
  acceptance:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      memcached:
        image: memcached:1.6-alpine
        ports: ["11211:11211"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build --wheel
      - run: |
          python -m venv /tmp/acc-venv
          /tmp/acc-venv/bin/pip install dist/*.whl pytest pytest-django pytest-asyncio djangorestframework redis pymemcache gunicorn uvicorn
          mkdir /tmp/acc && cp -r acceptance /tmp/acc/
      - name: Acceptance suite against the installed wheel (LocMem)
        working-directory: /tmp/acc
        env:
          TW_ACCEPTANCE_INSTALLED: "1"
        run: /tmp/acc-venv/bin/python -m pytest -c acceptance/pytest.ini acceptance -q
      - name: Acceptance suite against the installed wheel (Redis)
        working-directory: /tmp/acc
        env:
          TW_ACCEPTANCE_INSTALLED: "1"
          TW_REDIS_URL: redis://localhost:6379/2
        run: /tmp/acc-venv/bin/python -m pytest -c acceptance/pytest.ini acceptance -q
      - name: Acceptance suite against the installed wheel (Memcached)
        working-directory: /tmp/acc
        env:
          TW_ACCEPTANCE_INSTALLED: "1"
          TW_MEMCACHED: localhost:11211
        run: /tmp/acc-venv/bin/python -m pytest -c acceptance/pytest.ini acceptance -q
      - name: Multi-worker deployment (gunicorn x4, uvicorn x4; Redis and Memcached stores)
        working-directory: /tmp/acc
        env:
          TW_DEPLOY: "1"
          TW_REDIS_URL: redis://localhost:6379/3
          TW_MEMCACHED: localhost:11211
        run: /tmp/acc-venv/bin/python -m pytest -c acceptance/pytest.ini acceptance/deploy -q
