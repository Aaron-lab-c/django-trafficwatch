# Acceptance suite: a stand-alone Django project configured the way the README says, driven
# only through public API and HTTP. Run from the repo:
#     pytest -c acceptance/pytest.ini
# or, as CI does, against the *installed* wheel from a directory outside the repo so that
# ``src/`` is not importable:
#     cp -r acceptance /tmp/acc && cd /tmp/acc && pytest -c acceptance/pytest.ini
[pytest]
DJANGO_SETTINGS_MODULE = project.settings
pythonpath = .
testpaths = .
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
django_debug_mode = keep
addopts = -p no:cacheprovider
